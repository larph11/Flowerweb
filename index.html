<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PBB COLAB LIVE — Full Width Video</title>
  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:url('https://flixpatrol.com/runtime/cache/files/posters/z/w350/zuva0cs2sojoxfppwinbpevzoax.jpg') no-repeat center center/cover;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:white;
      overflow-x:hidden;
    }

    .title{
      font-weight:700;
      letter-spacing:2px;
      font-size:clamp(18px, 4vw, 28px);
      background:rgba(0,0,0,0.5);
      padding:10px 20px;
      border-radius:10px;
      margin-bottom:12px;
      text-align:center;
      width:90%;
      max-width:1100px;
    }

    .video-container{
      position:relative;
      width:100%;
      max-width:none;
      aspect-ratio:16/9;
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      border-radius:0;
      overflow:hidden;
    }

    iframe{
      width:100vw;
      height:calc(100vw * 9 / 16);
      max-height:80vh;
      border:0;
      display:block;
    }

    .fullscreen-btn{
      margin-top:12px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      color:white;
      padding:10px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      transition:0.2s;
    }

    .fullscreen-btn:hover{background:rgba(255,255,255,0.2)}

    @media (orientation:portrait){
      iframe{
        width:100vw;
        height:calc(100vw * 9 / 16);
      }
    }
  </style>
</head>
<body>
  <div class="title">PBB COLAB LIVE</div>
  <div id="videoContainer" class="video-container">
    <iframe id="pbbVideo" src="https://www.youtube.com/embed/BGxBURv_gr8" title="Kapuso Stream: Pinoy Big Brother Collab Edition 2.0 | ALL-ACCESS LIVESTREAM" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <button id="fsBtn" class="fullscreen-btn">Toggle Fullscreen</button>

  <script>
    const container = document.getElementById('videoContainer');
    const fsBtn = document.getElementById('fsBtn');

    function toggleFullscreen(){
      if(document.fullscreenElement){
        document.exitFullscreen();
      } else {
        if(container.requestFullscreen){
          container.requestFullscreen();
        }
      }
    }

    fsBtn.addEventListener('click', toggleFullscreen);
  </script>
</body>
</html>
