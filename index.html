<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PBB COLAB LIVE — Embedded Video</title>
  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:url('background.jpg') no-repeat center center/cover;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:white;
    }

    .title{
      font-weight:700;
      letter-spacing:2px;
      font-size:clamp(18px, 3vw, 26px);
      background:rgba(0,0,0,0.5);
      padding:10px 20px;
      border-radius:10px;
      margin-bottom:12px;
      text-align:center;
    }

    .video-container{
      position:relative;
      width:90%;
      max-width:916px;
      aspect-ratio:16/9;
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      border-radius:12px;
      overflow:hidden;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
    }

    .fullscreen-btn{
      margin-top:12px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      color:white;
      padding:8px 14px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      transition:0.2s;
    }

    .fullscreen-btn:hover{background:rgba(255,255,255,0.2)}

    .pseudo-fullscreen{
      position:fixed !important;
      top:0;left:0;right:0;bottom:0;
      width:100vw !important;
      height:100vh !important;
      z-index:99999;
      margin:0 !important;
      border-radius:0 !important;
    }
  </style>
</head>
<body>
  <div class="title">PBB COLAB LIVE</div>
  <div id="videoContainer" class="video-container">
    <iframe id="pbbVideo" width="916" height="389" src="https://www.youtube.com/embed/BGxBURv_gr8" title="Kapuso Stream: Pinoy Big Brother Collab Edition 2.0 | ALL-ACCESS LIVESTREAM" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <button id="fsBtn" class="fullscreen-btn">Toggle Fullscreen</button>

  <script>
    const container = document.getElementById('videoContainer');
    const fsBtn = document.getElementById('fsBtn');

    function toggleFullscreen(){
      if(document.fullscreenElement){
        document.exitFullscreen();
      } else {
        if(container.requestFullscreen){
          container.requestFullscreen();
        }
      }
    }

    fsBtn.addEventListener('click', toggleFullscreen);
  </script>
</body>
</html>
